<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <title>Strim</title>
    <meta name="description" content="Strim playlist editor: switch off the IPTV groups you never watch and get a clean player link." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://strim.plis.dev/app" />
    <link rel="icon" href="/logo-icon.svg" type="image/svg+xml" />

    <!-- No third-party scripts, styles or fonts: the app ships as plain CSS and one ES module.
         connect-src allows the local API on :5000 for the split frontend/API dev setup. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://image.tmdb.org; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000; form-action 'self'; base-uri 'self';" />

    <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/bricolage-grotesque-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="library.css" />
    <script type="module" src="library.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Strim home">
        <span class="wordmark" aria-hidden="true">str<span class="wm-i">ı<span class="wm-dot"></span></span>m</span>
      </a>
      <button id="account-button" type="button" class="account guest" aria-haspopup="dialog" hidden>Sign in</button>
    </header>

    <main id="app" class="page">
      <div class="boot"><span class="spinner" aria-label="Loading"></span></div>
    </main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <dialog id="account-dialog" class="sheet" aria-labelledby="account-title">
      <div class="sheet-head">
        <h2 id="account-title">Sign in</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg>
        </button>
      </div>
      <div id="account-body" class="sheet-body"></div>
    </dialog>

    <dialog id="menu-dialog" class="sheet" aria-labelledby="menu-title">
      <div class="sheet-head">
        <h2 id="menu-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></svg>
        </button>
      </div>
      <div id="menu-body" class="sheet-body"></div>
    </dialog>

    <footer class="site-links">
      <a href="/">Home</a>
      <a href="features.html">Features</a>
      <a href="how-to-use.html">How to use</a>
      <a href="comparison.html">Compare</a>
      <a href="https://github.com/plis-labs/strim" rel="noopener">Source</a>
      <p id="tmdb-attribution" class="tmdb-attribution" hidden>
        <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer" class="tmdb-link">
          <img id="tmdb-logo" src="/tmdb-logo.svg" alt="TMDB" class="tmdb-logo">
        </a>
        <span>This application uses TMDB and the TMDB APIs but is not endorsed, certified, or otherwise approved by TMDB.</span>
      </p>
    </footer>
  </body>
</html>
