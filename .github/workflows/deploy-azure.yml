name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: switzerlandnorth
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment input
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev|prod) ;; 
            *) echo "Unsupported environment '$ENVIRONMENT'. Use dev or prod." >&2; exit 1 ;;
          esac

      - name: Derive image tag
        id: tag
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-${GITHUB_SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG (env=$ENVIRONMENT)"

      - name: Terraform plan
        working-directory: infra/terraform
        env:
          TF_VAR_container_image: ${{ secrets.DOCKERHUB_USERNAME }}/strim
          TF_VAR_container_image_tag: ${{ steps.tag.outputs.tag }}
          TF_VAR_docker_registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_docker_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_project_name: strim-${{ env.ENVIRONMENT }}
          TF_VAR_resource_group_name: strim-${{ env.ENVIRONMENT }}-rg
          TF_VAR_app_service_plan_name: strim-${{ env.ENVIRONMENT }}-plan
          TF_VAR_app_service_name: strim-${{ env.ENVIRONMENT }}-app
          TF_VAR_file_share_name: strim${{ env.ENVIRONMENT }}data
          TF_VAR_location: ${{ env.AZURE_LOCATION }}
          TF_VAR_docker_registry_url: https://index.docker.io
          TF_VAR_container_port: 8080
          TF_VAR_sqlite_mount_path: /var/strim/data
          TF_VAR_allowed_origins: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan -no-color

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_container_image: ${{ secrets.DOCKERHUB_USERNAME }}/strim
          TF_VAR_container_image_tag: ${{ steps.tag.outputs.tag }}
          TF_VAR_docker_registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          TF_VAR_docker_registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_project_name: strim-${{ env.ENVIRONMENT }}
          TF_VAR_resource_group_name: strim-${{ env.ENVIRONMENT }}-rg
          TF_VAR_app_service_plan_name: strim-${{ env.ENVIRONMENT }}-plan
          TF_VAR_app_service_name: strim-${{ env.ENVIRONMENT }}-app
          TF_VAR_file_share_name: strim${{ env.ENVIRONMENT }}data
          TF_VAR_location: ${{ env.AZURE_LOCATION }}
          TF_VAR_docker_registry_url: https://index.docker.io
          TF_VAR_container_port: 8080
          TF_VAR_sqlite_mount_path: /var/strim/data
          TF_VAR_allowed_origins: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan -no-color

      - name: Restart App Service
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          az webapp restart \
            --name "strim-${ENVIRONMENT}-app" \
            --resource-group "strim-${ENVIRONMENT}-rg"

      - name: Wait for healthy
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          URL="https://strim-${ENVIRONMENT}-app.azurewebsites.net/health"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL" --max-time 10 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, waiting…"
            sleep 10
          done
          echo "App failed to become healthy after 12 attempts"
          exit 1

      - name: Emit audit metadata
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          jq -n \
            --arg action "terraform_apply" \
            --arg environment "$ENVIRONMENT" \
            --arg actor "${{ github.actor }}" \
            --arg commit "${{ github.sha }}" \
            --arg image_tag "$IMAGE_TAG" \
            '{timestamp: now | todate, action: $action, environment: $environment, actor: $actor, commit: $commit, image_tag: $image_tag}'
